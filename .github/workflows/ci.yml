name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Python syntax and unit tests
        run: |
          python -m compileall -q video_cutout.py tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python video_cutout.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse every PowerShell script
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Host $_ }
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }
      - name: Install and uninstall without model downloads
        shell: powershell
        run: .\tests\test_install.ps1
